<!doctype html>
<html lang="zh-CN">
  <meta charset="UTF-8" />
  <title>图片翻译本地验收</title>
  <style>
    body {
      font: 16px/1.7 system-ui;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }
    button,
    select {
      margin: 8px;
      padding: 8px 14px;
    }
    #sample {
      display: block;
      border: 1px solid #ddd;
      max-width: 100%;
    }
  </style>
  <h1>图片翻译本地验收</h1>
  <p>使用生产界面、浏览器解码、独立 Worker 和本地 HTTP。译文是固定测试数据。</p>
  <button id="open">打开快捷翻译</button>
  <button id="stats">刷新请求计数</button>
  <select id="locale" aria-label="验收界面语言">
    <option value="zh-CN">中文</option>
    <option value="en">English</option>
    <option value="ar">العربية</option>
  </select>
  <pre id="counts">尚未发送图片</pre>
  <canvas id="sample" width="600" height="200"></canvas>
  <p>
    <a id="png" download="image-translation-sample.png">下载测试 PNG</a> ·
    <a id="jpeg" download="image-translation-sample.jpg">下载测试 JPEG</a> ·
    <a id="webp" download="image-translation-sample.webp">下载测试 WebP</a>
  </p>
  <script type="module">
    import { QuickTranslationController } from '../../src/content/quick-translation-controller.ts';
    import { QuickTranslationDialog } from '../../src/content/quick-translation-dialog.tsx';
    import { setUiLanguage } from '../../src/shared/i18n.ts';
    const worker = new Worker(new URL('./fixture-worker.js', import.meta.url), { type: 'module' });
    const pending = new Map();
    let sequence = 0;
    worker.onmessage = ({ data }) => {
      const { id, result } = JSON.parse(data);
      pending.get(id)?.(result);
      pending.delete(id);
    };
    const model = new QuickTranslationController(
      (request) =>
        new Promise((resolve) => {
          const id = ++sequence;
          pending.set(id, resolve);
          worker.postMessage(JSON.stringify({ id, request }));
        }),
    );
    setUiLanguage('zh-CN');
    const dialog = new QuickTranslationDialog(model);
    document.querySelector('#open').onclick = () => dialog.open();
    document.querySelector('#stats').onclick = async () => {
      document.querySelector('#counts').textContent = JSON.stringify(
        await fetch('/image-stats').then((r) => r.json()),
        null,
        2,
      );
    };
    document.querySelector('#locale').onchange = (event) => setUiLanguage(event.target.value);
    const canvas = document.querySelector('#sample');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#faf7ee';
    ctx.fillRect(0, 0, 600, 200);
    ctx.fillStyle = '#28332d';
    ctx.font = 'bold 44px sans-serif';
    ctx.fillText('WELCOME', 40, 85);
    ctx.font = '28px sans-serif';
    ctx.fillText('Open 9:00–18:00', 40, 145);
    for (const type of ['png', 'jpeg', 'webp'])
      document.querySelector('#' + type).href = canvas.toDataURL('image/' + type);
  </script>
</html>
