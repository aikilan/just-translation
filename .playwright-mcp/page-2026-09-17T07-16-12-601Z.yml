            - paragraph [ref=e116]: I’m back on schizogram again.
            - paragraph [ref=e117]:
              - text: The posts are all different, but all the same. A man
              - link "hides in the bushes" [ref=e118] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DbwhRBMONoN/?stkn=MWttMDRiaXJwbTM3cg%3D%3D
              - text: from the authorities. A shirtless old woman
              - link "yells obscenities at her camera" [ref=e119] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DcqKamngWJh/?stkn=MWIyMWZsbDNxcnpmdg%3D%3D
              - text: . A wild-eyed college burnout shares his discovery that we’re living in a
              - link "300,000-year-old simulation" [ref=e120] [cursor=pointer]:
                - /url: https://www.tiktok.com/@danielwilliamschmidt/video/7657357047112961311?_r=1&_t=ZT-99iebLioWFR
              - text: .
            - paragraph [ref=e121]:
              - text: "Each video has millions of views, and the comments range from concerned to encouraging. “Keep talking to the AI, it’s working.” “Please get help!” “I think bro is onto something.” In any case, the audience shares a frame of reference that the user does not:"
              - emphasis [ref=e122]: we are sane, and they are insane
              - text: .
            - paragraph [ref=e123]:
              - text: Now I’m on Old Person Instagram. A woman
              - link "taps her phone" [ref=e124] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DaiHFvOCZmH/?stkn=NWw5bXR4eWZ5ZTgw
              - text: in confusion. Another
              - link "squints at her screen" [ref=e125] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DZvU1C0JqZI/?stkn=a3oyOGEweGszNmRu
              - text: before starting to speak. A third
              - link "accidentally zooms" [ref=e126] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DaCuF4kOfXg/?stkn=MTM2ZWZmMXdqemQyZg%3D%3D
              - text: "onto her own forehead. Here, the comments are warmer, but the underlying relation is the same as on schizogram. There is a power dynamic between the viewer and the poster:"
              - emphasis [ref=e127]: they don’t understand the internet, but I do
              - text: .
            - paragraph [ref=e128]: In both of these instances, the naïve user unwittingly serves as a “lolcow”—an internet laughingstock who can be milked for laughs just like a “cash cow” can be milked for money. Except it’s really more about control. The humor is only enjoyed when the viewers can situate themselves as more knowledgeable or important.
            - paragraph [ref=e129]:
              - text: The classic example of a lolcow is Joshua Block, known online as
              - link "@worldoftshirts" [ref=e130] [cursor=pointer]:
                - /url: https://www.tiktok.com/@worldoftshirts
              - text: . Block is a clearly autistic young man known for drinking on camera and being goaded into public meltdowns by his viewers. While some people genuinely try to help, and others antagonize him further, both the instincts to protect and attack come from an assumed position of power over the lolcow. The feeling of asymmetry gives you a license to intervene, to try to shape this person’s life for better or for worse.
            - paragraph [ref=e131]:
              - text: But every influencer-viewer dynamic comes with its own asymmetry. To look at someone is to objectify them, projecting a certain interpretation that cannot possibly match onto their more complex reality. To look at an image or video, meanwhile, is to objectify without the possibility of reciprocity. As Susan Sontag writes in
              - emphasis [ref=e132]: On Photography
              - text: ", “photographs give people an imaginary possession of a past that is unreal.”"
            - paragraph [ref=e133]: They can’t see me, but I can see them.
            - paragraph [ref=e134]:
              - text: With this asymmetry, the influencer inherently becomes a spectacle to be poked and prodded for your amusement. People check in on Charli D’Amelio
              - link "like she’s their personal Tamagotchi" [ref=e135] [cursor=pointer]:
                - /url: https://www.tiktok.com/t/ZTUbHg6HW/
              - text: . Millions
              - link "unfollowed Vexbolts" [ref=e136] [cursor=pointer]:
                - /url: https://knowyourmeme.com/memes/events/vexbolts-mass-unfollowing-december-31st-2024
              - text: and helped
              - link "MrBeast overtake T-Series" [ref=e137] [cursor=pointer]:
                - /url: https://www.bbc.com/news/articles/c8440yxd92xo
              - text: and
              - link "trolled KSI" [ref=e138] [cursor=pointer]:
                - /url: https://knowyourmeme.com/memes/🪑-chair-emoji-on-tiktok
              - text: with the chair emoji. You, the viewer, can help determine an influencer’s reality. As popular as they might appear, they can’t do anything back to you. They are the court jester and you are their king.
            - paragraph [ref=e139]:
              - text: Everybody trying to make it online inevitably experiences some form of
              - emphasis [ref=e140]: audience capture
              - text: ", where our followers push us into expressing certain ideas and behaviors—so everybody is a lolcow to some degree. I like to think of myself as fairly independently minded, but I still feel myself regularly conforming to what I think my audience will appreciate."
            - paragraph [ref=e141]:
              - text: "There’s a spectrum, to be sure. The more you rely on your followers, the more you have to debase yourself for their approval: begging for galaxies on TikTok live, letting people dictate what you say on Cameo, selling little"
              - link "moments in your life" [ref=e142] [cursor=pointer]:
                - /url: https://www.nytimes.com/2021/03/10/style/creators-selling-selves.html
              - text: ". Then there are those who keep posting even though they’re clearly the butt of a joke:"
              - link "Ned Fulmer" [ref=e143] [cursor=pointer]:
                - /url: https://www.youtube.com/@NedFulmer
              - text: ", the “"
              - link "cuh dey board" [ref=e144] [cursor=pointer]:
                - /url: https://www.tiktok.com/@ohmontaine
              - text: ” guy, arguably George Santos. These are more traditional lolcows, pathologically catering to the people who despise them.
            - paragraph [ref=e145]:
              - text: But at least these influencers still know what’s happening. Another type of lolcow doesn’t understand that they are amusing to their audience, or at least doesn’t understand
              - emphasis [ref=e146]: why
              - text: . This includes the elderly, the naïve, and the mentally disabled, but the asymmetry could also manifest as educated versus uneducated, urban versus rural, ironic versus sincere.
            - paragraph [ref=e147]:
              - text: Every so often, I’ll come across a viral video of a Russian family
              - link "eating breakfast together" [ref=e148] [cursor=pointer]:
                - /url: https://www.tiktok.com/@kolbasenko_irina/video/7623348029101313300?is_from_webapp=1&sender_device=pc&web_id=7683558458901644814
              - text: or an African man
              - link "carrying water across a river" [ref=e149] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DYXZTDfKH3j/?stkn=MWg2dDJwOWZ6a29vNg==
              - text: or two Cambodian men
              - link "building houses in the jungle" [ref=e150] [cursor=pointer]:
                - /url: https://www.youtube.com/watch?v=hC9neGH7qXs
              - text: . While these videos can provide a genuinely interesting window into another world, part of the appeal is that the Western viewer can judge them as “quaint,” “rustic,” or “provincial.” We feel a sense of touristic power behind our screens, watching the reel from a more sophisticated viewpoint.
            - paragraph [ref=e151]: "Many international content creators might understand this way of looking, but I’m sure many do not. They are not situated in the same interpretive frame. They know that people enjoy watching their videos, but they don’t know it’s because they’re part of the algorithmic freak show: a collection of digital specimens to be examined by the cosmopolitan observer. This imbalance only adds to the spectacle."
            - figure [ref=e153]:
              - link [ref=e154] [cursor=pointer]:
                - /url: https://substackcdn.com/image/fetch/$s_!qK2o!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F61e0c1f3-e256-49cb-9d0b-a7b3eb14c171_1179x547.jpeg
                - img "IMG_4646.jpeg" [ref=e157]
            - paragraph [ref=e158]:
              - text: Just as lolcows exist along a continuum, so do their viewers. On the extreme end, agitators coordinate abusive behavior on
              - link "Kiwi Farms" [ref=e159] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Kiwi_Farms
              - text: ", but everyone is complicit to a lesser extent. As the internet has shifted away from 2010s influencer culture to idealize a raw, unmediated style of content, I’ve specifically noticed a rising interest in these “lolcow lite” genres, where you get to feel a heightened sense of agency without resorting to overt cyberbullying."
            - paragraph [ref=e160]: I do not think it is a coincidence that the schizo/boomer/foreign style of video has become more popular just as we are losing control over the internet as a whole. Everything feels like a psyop right now, but at least I can laugh over this crazy guy who doesn’t know how to use his phone properly.
            - paragraph [ref=e161]:
              - text: Ironically, the lolcow aesthetic is already being exploited by malicious actors—it’s fairly trivial to make an AI-generated profile where you
              - link "mimic the semiotics of naïveté" [ref=e162] [cursor=pointer]:
                - /url: https://www.instagram.com/reel/DcemhfoTZ9B/?stkn=eWxlM2I4cDR2MnBv
              - text: while actually baiting engagement.
            - paragraph [ref=e163]:
              - text: Regardless, I am concerned that these kinds of posts will only continue to go viral as we become desensitized to our own spectatorship. As they do, the online dynamics we subject influencers to will trickle down to everyone else. I regularly see random people’s Instagram posts blow up because they have a
              - link "funny last name" [ref=e164] [cursor=pointer]:
                - /url: https://www.instagram.com/p/DdPULgMCdUy/?stkn=MjB0bGJ2cnBpNTg=
              - text: or embody an internet stereotype. By making yourself legible, you make yourself vulnerable to attack, because
              - emphasis [ref=e165]: someone
              - text: will find a way to perceive you harmfully.
            - paragraph [ref=e166]: The word “respect” in Latin literally means “to look back.” The proper way to treat each other as human beings is to act as if everyone can meet our gaze—seeing us the way we see them. If we don’t learn to look back, we’ll keep trying to control each other, and everybody online will be a lolcow to someone else.
